syntax = "proto3";
package waywallen.steam;

// Minimal subset of Steam's IAuthenticationService messages

message DeviceDetails {
  string device_friendly_name = 1;
  int32 platform_type = 2; // EAuthTokenPlatformType: SteamClient = 1
  int32 os_type = 3;
}

message BeginAuthSessionViaQrRequest {
  string device_friendly_name = 1;
  int32 platform_type = 2;
  DeviceDetails device_details = 3;
  string website_id = 4;
}

message BeginAuthSessionViaQrResponse {
  uint64 client_id = 1;
  string challenge_url = 2;
  bytes request_id = 3;
  float interval = 4;
  int32 version = 6;
}

message PollAuthSessionStatusRequest {
  uint64 client_id = 1;
  bytes request_id = 2;
}

message PollAuthSessionStatusResponse {
  uint64 new_client_id = 1;
  string new_challenge_url = 2;
  string refresh_token = 3;
  string access_token = 4;
  bool had_remote_interaction = 5;
  string account_name = 6;
  string new_guard_data = 7;
}

// DepotDownloader account.config (protobuf-net). We only populate LoginTokens
// (member 4, account name -> refresh token); the map wire format matches
// protobuf-net's Dictionary<string,string>.
message AccountSettingsStore {
  map<string, string> login_tokens = 4;
  map<string, string> guard_data = 5;
}
